<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weekly Tracker</title>
<meta name="description" content="My weekly progress tracker.">
<meta name="theme-color" content="#5b8cff">
<meta property="og:type" content="website">
<meta property="og:site_name" content="UKCR Tracker">
<meta property="og:title" content="UKCR Progress Tracker">
<meta property="og:description" content="What I'm working on, week by week.">
<meta property="og:url" content="https://ukcr-tracker-site.pages.dev/">
<meta property="og:image" content="https://ukcr-tracker-site.pages.dev/preview.png">
<meta name="twitter:card" content="summary_large_image">  
<script>try{var R=document.documentElement,T=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"),A=localStorage.getItem("accent");R.dataset.theme=T;if(/^#[0-9a-f]{6}$/i.test(A))R.style.setProperty("--accent",A)}catch(e){document.documentElement.dataset.theme="dark"}</script>
<style>
:root{color-scheme:dark;--text:#e8ecf5;--muted:#9aa4b8;--line:rgba(255,255,255,.13);--card:rgba(14,18,30,.62);--accent:#5b8cff;--green:#2ee6a0;
--bg:#07090f;--fill:rgba(255,255,255,.06);--track:rgba(255,255,255,.1);--input:rgba(0,0,0,.35);--sheen:rgba(255,255,255,.28);--blob:.45;--blob3:.3;
--st-todo:#9aa4b8;--st-prog:#5ea8ff;--st-done:#2ee6a0;--st-block:#ff6b7d}
:root[data-theme=light]{color-scheme:light;--text:#141a2b;--muted:#566077;--line:rgba(20,26,43,.14);--card:rgba(255,255,255,.74);--green:#12b57f;
--bg:#f3f5fb;--fill:rgba(20,26,43,.05);--track:rgba(20,26,43,.1);--input:rgba(255,255,255,.9);--sheen:rgba(255,255,255,.7);--blob:.28;--blob3:.2;
--st-todo:#566077;--st-prog:#1b66c9;--st-done:#0a8a5b;--st-block:#c92a42}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);padding-bottom:70px}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg) center/cover no-repeat}
.bg i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:var(--blob);animation:drift 22s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--accent);top:-20%;left:-10%}
.bg i:nth-child(2){background:#12c48b;bottom:-25%;right:-10%;animation-duration:28s}
.bg i:nth-child(3){background:#8a3cff;top:30%;left:35%;animation-duration:34s;opacity:var(--blob3)}
@keyframes drift{to{transform:translate(12vmax,8vmax) scale(1.2)}}
header{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--card);backdrop-filter:blur(12px);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--green));display:grid;place-items:center;font-weight:700;overflow:hidden;color:#fff}
.logo img{width:100%;height:100%;object-fit:cover}
nav{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.btn{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--fill);color:var(--text);padding:10px 18px;border-radius:12px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .2s,border-color .2s,box-shadow .2s}
.btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,var(--sheen),transparent);transform:skewX(-20deg);transition:left .5s}
.btn:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn:hover::after{left:130%}
.btn.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,transparent)}
.tgl{padding:10px 14px;line-height:1}
main{max-width:980px;margin:0 auto;padding:28px 22px;animation:fade .5s}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.status{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;background:var(--green);animation:pulse 1.8s infinite;flex:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,230,160,.7)}70%{box-shadow:0 0 0 18px rgba(46,230,160,0)}100%{box-shadow:0 0 0 0 rgba(46,230,160,0)}}
.status b{font-size:1.05rem}
.bar{flex:1;min-width:200px;height:22px;border-radius:999px;background:var(--track);border:1px solid var(--line);overflow:hidden;position:relative}
.bar span{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--green));transition:width 1.4s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.bar span::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:sheen 2.2s infinite}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.pct{min-width:48px;text-align:right;font-variant-numeric:tabular-nums}
.hero{text-align:center;padding:80px 10px 70px}
.hero h1{font-size:clamp(2rem,6vw,3.6rem);letter-spacing:-.02em}
.hero p{color:var(--muted);margin-top:12px;font-size:1.1rem}
h2{margin:6px 0 16px}
.card{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
.muted{color:var(--muted);font-size:.92rem}
.task{margin:16px 0}
.task .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:10px}
.tn{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{--c:var(--st-todo);display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;line-height:1;padding:4px 10px;border-radius:99px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.progress{--c:var(--st-prog)}.badge.done{--c:var(--st-done)}.badge.blocked{--c:var(--st-block)}
.bar.sm{height:14px}
.notes p{margin:0 0 12px;line-height:1.65}
.uptime{position:fixed;left:16px;bottom:14px;background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:.85rem;display:flex;align-items:center;gap:10px}
.uptime .dot{width:10px;height:10px;animation-duration:2.4s}
.uptime b{font-variant-numeric:tabular-nums}
.ed input,.ed textarea,.ed select{width:100%;background:var(--input);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 11px;font:inherit;margin:4px 0 10px}
.ed textarea{min-height:120px}
.ed label{font-size:.8rem;color:var(--muted)}
.ed .g{display:grid;grid-template-columns:1fr 150px 110px;gap:10px}
@media(max-width:640px){.ed .g{grid-template-columns:1fr}}
.ed .acc{display:flex;align-items:center;gap:12px;margin:4px 0 10px}.ed .acc input{width:56px;height:38px;padding:2px;margin:0;cursor:pointer}.ed .acc code{color:var(--muted)}
.sm2{padding:6px 12px;font-size:.85rem}
.msg{margin-left:12px}
.elink{color:var(--muted);font-size:.8rem;text-decoration:none}
.av{position:relative;flex:none}
.sd{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;border:3px solid var(--bg);background:#7c869e;display:none}
.dct{display:flex;flex-direction:column;line-height:1.3;max-width:220px}
.dct small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:700px){.dct{display:none}}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.gallery img{width:100%;height:150px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.ed .th{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.ed .th div{display:flex;flex-direction:column;gap:4px;align-items:center}
.ed .th img{width:84px;height:62px;object-fit:cover;border-radius:8px}
.tag{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 8px;margin-left:8px}

main.wide{max-width:1180px}body.isadm .uptime{display:none}
.upd{color:var(--muted);font-size:.78rem}
.overall{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}@media(max-width:640px){.overall{grid-template-columns:1fr;justify-items:center}}
.ring{--p:0;width:130px;height:130px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent),var(--green) calc(var(--p)*1%),var(--track) 0)}
.ring span{width:100px;height:100px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:1.7rem;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px;width:100%}
.stat{background:var(--fill);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.stat b{font-size:1.4rem;display:block}.stat small{color:var(--muted)}
.wb{display:flex;gap:8px;align-items:flex-end;height:96px;overflow-x:auto;padding-bottom:2px}
.wb a{flex:1;min-width:34px;max-width:70px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;text-decoration:none;color:var(--muted);font-size:.72rem}
.wb a i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(var(--accent),var(--green));min-height:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}.seg .btn{border:0;border-radius:0}
.tl{position:relative;padding-left:30px;margin-top:10px}.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tli{position:relative}.tli .card{display:block;color:inherit;text-decoration:none;transition:border-color .2s}.tli .card:hover{border-color:var(--accent)}
.tli::before{content:"";position:absolute;left:-27px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--st-todo)}
.tli.done::before{border-color:var(--st-done);background:var(--st-done)}.tli.cur::before{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 25%,transparent)}
.tli.cur .card{border-color:var(--accent)}.tli.fut{opacity:.8}
.today{position:relative;margin:4px 0 14px;color:var(--accent);font-size:.8rem;font-weight:600}.today::before{content:"";position:absolute;left:-27px;top:50%;width:calc(100% + 27px);border-top:2px dashed var(--accent);opacity:.5;z-index:-1}.today span{background:var(--bg);padding:0 8px 0 0}
.calh{display:flex;align-items:center;gap:10px;margin-bottom:12px}.calh h3{flex:1;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .dh{text-align:center;color:var(--muted);font-size:.75rem;padding:4px}
.cal>*{min-height:74px;border:1px solid var(--line);border-radius:10px;padding:5px;background:var(--fill);display:flex;flex-direction:column;gap:3px;color:var(--text);text-decoration:none;min-width:0}
.cal .dh{min-height:0;border:0;background:none}.cal .out{opacity:.4}.cal .today2{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal a.inw{background:linear-gradient(to top,color-mix(in srgb,var(--accent) 38%,transparent) calc(var(--p)*1%),color-mix(in srgb,var(--accent) 10%,transparent) 0)}
.cal .dn{font-size:.8rem}.chip{font-size:.68rem;font-weight:600;background:var(--accent);color:#fff;border-radius:6px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:640px){.cal>*{min-height:54px;padding:3px}.chip{font-size:.6rem}}
.toast{position:fixed;top:84px;right:16px;z-index:20;background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:12px;padding:10px 16px;opacity:0;transform:translateY(-8px);pointer-events:none;transition:.25s;max-width:min(360px,90vw)}
.toast.show{opacity:1;transform:none}.toast.err{border-left-color:var(--st-block)}
/* admin */
.adm .admtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.adm .admtop>div:first-child{flex:1}.adm h2{margin:0}
.admact{display:flex;gap:8px}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:inherit;padding:10px 14px;cursor:pointer;white-space:nowrap}.tabs button.on{color:var(--text);border-color:var(--accent);font-weight:600}
.wgrid{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}@media(max-width:800px){.wgrid{grid-template-columns:1fr}}
.wside{position:sticky;top:96px;display:flex;flex-direction:column;gap:8px}@media(max-width:800px){.wside{position:static}}
.wi{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--text);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:5px;width:100%}.wi.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.wi b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed .card h3{font-size:1rem}.ed .card .row{margin-bottom:10px}.ed .acts{display:flex;gap:6px;flex-wrap:wrap}
.ed .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.ed .two{grid-template-columns:1fr}}
.fld{margin-bottom:12px}.fld label{display:block;font-size:.82rem;color:var(--text);font-weight:600}.fld input,.fld textarea,.fld select{margin:5px 0 0}.fld small{color:var(--muted);font-size:.78rem;display:block;margin-top:3px}
.trow{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--fill);display:grid;gap:8px}
.trow .t1{display:grid;grid-template-columns:1fr 140px auto;gap:8px;align-items:center}.trow .t2{display:flex;align-items:center;gap:10px}
.ed .trow input,.ed .trow select{margin:0}.ed .trow .t2 input[type=range]{flex:1;padding:0;accent-color:var(--accent)}.ed .trow .t2 .pn{width:72px}
.tbt{display:flex;gap:4px}@media(max-width:560px){.trow .t1{grid-template-columns:1fr 1fr}.tbt{grid-column:1/-1}}
.empty{color:var(--muted);text-align:center;padding:18px;border:1px dashed var(--line);border-radius:12px}
.drop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.ed .drop input[type=file]{width:auto;margin:0}.prev{width:84px;height:62px;border-radius:8px;border:1px solid var(--line);object-fit:cover;background:var(--fill)}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.pill{font-size:.78rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}.pill.dirty{color:#f5b942;border-color:#f5b942}
.savebar{position:fixed;left:50%;bottom:18px;transform:translate(-50%,120px);z-index:15;display:flex;align-items:center;gap:12px;background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--accent);border-radius:16px;padding:10px 14px;box-shadow:0 10px 40px rgba(0,0,0,.35);transition:transform .3s;max-width:94vw}
.savebar.show{transform:translate(-50%,0)}
.live{display:inline-flex;align-items:center;gap:8px;font-weight:600}.live i{width:12px;height:12px;border-radius:50%;background:var(--green)}.live.off i{background:var(--st-block)}
.al{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--fill)}
.ed .seg{display:flex;margin-bottom:2px}.ed .seg .btn{flex:1;padding:6px 8px}
.ed .stats{margin-bottom:14px}
@media print{header,.uptime,.toast,#warn,.savebar,.noprint{display:none!important}body{background:#fff!important;color:#000!important}.card,.status{box-shadow:none!important;background:#fff!important;border:1px solid #bbb!important;break-inside:avoid}.muted{color:#444!important}main{max-width:none!important;padding:0!important}}
</style>
</head>
<body>
<div class="bg" id="bg"><i></i><i></i><i></i></div>
<header>
  <div class="av"><div class="logo" id="logo"></div><span class="sd" id="sd"></span></div>
  <div class="dct" id="dct"></div>
  <nav id="nav"></nav>
  <button class="btn tgl" id="theme" type="button"></button>
</header>
<main id="app"></main>
<div class="toast" id="toast" role="status"></div>
<div id="warn" hidden style="position:sticky;top:0;z-index:30;background:#b3261e;color:#fff;padding:10px 16px;text-align:center;font-size:.9rem;line-height:1.4"></div>
<div class="uptime"><span class="dot"></span><span>Uptime <b id="up">...</b></span><a class="elink" href="#admin">Edit</a></div>

<script>
/* ============ EDIT THIS SECTION TO UPDATE YOUR SITE ============ */
let SITE = {
  title: "My Weekly Tracker",
  tagline: "What I’m working on, week by week.",
  logo: "",                         // image URL or file name, e.g. "logo.png" (leave "" for a letter)
  bgImage: "",                      // background image, e.g. "background.jpg" (leave "" for the animated glow)
  launchDate: "2026-11-17T00:00:00",// uptime counts from here
  currentWeek: 2,                   // which week shows in the Weekly Progress bar
  accent: "#5b8cff",               // accent colour (can also be changed on the Edit page)
  discordId: ""                     // your Discord user ID: shows your avatar + status in the top-left (can also be set in the Edit page)
};

let WEEKS = [
  { id: 1, title: "Week 1: Getting started", dates: "10 – 16 Nov",
    summary: "Set up the project and planned the next steps.",
    tasks: [
      { name: "Project setup", progress: 100, note: "Everything installed and working." },
      { name: "Planning", progress: 100, note: "Wrote down goals for the next few weeks." }
    ],
    notes: "Write your in-depth overview here.\nA new line starts a new paragraph." },
  { id: 2, title: "Week 2: Building", dates: "17 – 23 Nov",
    summary: "Working on the main features.",
    tasks: [
      { name: "Feature A", progress: 70, note: "Core part done, polishing left." },
      { name: "Feature B", progress: 35, note: "Started, still early." },
      { name: "Testing", progress: 10, note: "" }
    ],
    notes: "Add as much text as you like here.\nEdit it any time and re-upload the file." }
];

const PAGES = [   // the 4 buttons in the top bar
  { id: "home",  label: "Home" },
  { id: "weeks", label: "All Weeks" },
  { id: "timeline", label: "Timeline" },
  { id: "week-latest", label: "Latest Week" },
  { id: "contact", label: "Ask me" },
  { id: "about", label: "About" }
];
let ABOUT = "Write about yourself or the project here.\nEach new line is a new paragraph.";
/* ============ END OF EDIT SECTION ============ */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const paras = t => t.split("\n").filter(Boolean).map(p => `<p>${esc(p)}</p>`).join("");
const avg = w => w.tasks.length ? Math.round(w.tasks.reduce((a, t) => a + t.progress, 0) / w.tasks.length) : 0;
const ST = { todo: "Not started", progress: "In progress", done: "Done", blocked: "Blocked" };
const stOf = t => ST[t.status] ? t.status : (t.progress >= 100 ? "done" : t.progress > 0 ? "progress" : "todo");   // no status set = worked out from the percent
const badge = t => { const s = stOf(t); return `<span class="badge ${s}">${ST[s]}</span>`; };
const ACC = "#5b8cff", okHex = c => /^#[0-9a-f]{6}$/i.test(c || "");
const root = document.documentElement;
const accent = c => root.style.setProperty("--accent", okHex(c) ? c : ACC);
function setTheme(t) {
  root.dataset.theme = t; try { localStorage.setItem("theme", t); } catch (e) {}
  const b = $("theme"); b.textContent = t === "dark" ? "☀" : "☾";
  const l = t === "dark" ? "Switch to light theme" : "Switch to dark theme"; b.title = l; b.setAttribute("aria-label", l);
}
const bar = (p, sm) => `<div class="bar ${sm ? "sm" : ""}"><span data-w="${p}"></span></div>`;

let DC = null;
const SC = { online: "#2ee6a0", idle: "#f5b942", dnd: "#ff5b6e", offline: "#7c869e" };
const SL = { online: "Online", idle: "Idle", dnd: "Do not disturb", offline: "Offline" };
async function discord() {   // live Discord avatar + status via Lanyard (you must be in the Lanyard Discord server)
  if (!SITE.discordId) return;
  try {
    const j = await (await fetch("https://api.lanyard.rest/v1/users/" + encodeURIComponent(SITE.discordId))).json();
    if (!j.success) return;
    const d = j.data, u = d.discord_user, st = d.discord_status || "offline", acts = d.activities || [];
    const cs = acts.find(a => a.type === 4), g = acts.find(a => a.type !== 4);
    DC = { avatar: u.avatar ? `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.${u.avatar.startsWith("a_") ? "gif" : "png"}?size=128` : "",
           name: u.global_name || u.username, st, sub: (cs && cs.state) || (g && g.name) || SL[st] };
    look();
  } catch (e) {}
}

function look() {

  const o = tasks.length ? Math.round(tasks.reduce((a, x) => a + x.t.progress, 0) / tasks.length) : 0, go = i => `data-a="selw" data-go="weeks" data-i="${i}"`, al = [];
  tasks.filter(x => stOf(x.t) === "blocked").forEach(x => al.push(["🛑", `Blocked: <b>${esc(x.t.name || "Untitled")}</b> in ${esc(x.w.title)}`, go(x.i)]));
  tasks.filter(x => !x.w.archived && ISO.test(x.t.due || "") && stOf(x.t) !== "done" && pIso(x.t.due) < today()).forEach(x => al.push(["⏰", `Overdue: <b>${esc(x.t.name || "Untitled")}</b> in ${esc(x.w.title)} (due ${esc(x.t.due)})`, go(x.i)]));

    else if (avg(w) < 100 && w.updated && Date.now() - w.updated > 7 * 864e5) al.push(["⏳", `${esc(w.title)} hasn’t been edited in ${Math.floor((Date.now() - w.updated) / 864e5)} days`, go(i)]); });

/* Warns instead of silently showing placeholder text when the saved content can't be loaded. */
function warn() {
  const w = $("warn"); if (!w) return;
  const adm = location.hash === "#admin", bad = loadErr && loadErr !== "empty";
  if (!loadErr || (loadErr === "empty" && !adm)) { w.hidden = true; return; }
  w.hidden = false;
  w.textContent = !adm ? "Content is temporarily unavailable. Please try again soon." : bad
    ? `⚠️ Couldn’t load your saved content (error ${loadErr}). You are seeing placeholder text; your saved data has NOT been deleted. Saving is blocked until this is fixed. Open /api/health, and check that the functions folder is deployed and the TRACKER KV binding is set.`
    : "ℹ️ No saved content found in storage yet. If you expected your weeks to be here, don’t save: check the TRACKER KV binding first.";
}
let raw = null;
async function poll() {
  if (loaded && document.hidden) return;
  try {
    const r = await fetch("/api/data", { cache: "no-store" });
    if (!r.ok) { loadErr = r.status; warn(); return; }
    const t = await r.text(); if (t === raw) { if (loadErr) { loadErr = null; warn(); } return; }
    const had = raw !== null; raw = t; const d = JSON.parse(t);
    if (!(d && d.WEEKS && d.SITE)) { loadErr = d === null ? "empty" : "bad"; warn(); return; }
    loadErr = null; warn();
    apply(d); const h = location.hash.slice(1);
    if (h === "admin") { if (draft) accent(draft.SITE.accent); }
    else if (h !== "contact") { render(had); if (had) toast("Updated just now"); }
  } catch (e) { if (!loadErr) loadErr = "network"; warn(); } finally { if (!loaded) { loaded = true; if (location.hash === "#admin") render(); } }
}

  else if (a === "setp") { W.tasks[j].progress = 100; delete W.tasks[j].status; }
  else if (a === "up") { mv(D.WEEKS, i, -1); adm.wk = Math.max(0, i - 1); }
  else if (a === "down") { mv(D.WEEKS, i, 1); adm.wk = Math.min(D.WEEKS.length - 1, i + 1); }
  else if (a === "arch") W.archived = !W.archived;
  else if (a === "delimg") W.images.splice(j, 1);
  else if (a === "clr") D.SITE[el.dataset.k] = "";
  else if (a === "acc") { D.SITE.accent = el.dataset.k; accent(el.dataset.k); }
  else if (a === "accreset") { D.SITE.accent = ACC; accent(ACC); }
  else if (a === "discard") { if (!confirm("Throw away your unsaved changes?")) return; draft = clone({ SITE, WEEKS, ABOUT }); dirty = false; accent(SITE.accent); }
  else if (["siteoff", "siteon", "regcmds"].includes(a)) {
    const on = a === "siteon";
    if (a === "siteoff" && !confirm("Turn the whole site OFF? Visitors will see a maintenance page" + (offMsg.trim() ? " saying: " + offMsg.trim() : "") + ".")) return;
    toast("Working...");
    const r = await fetch(a === "regcmds" ? "/api/register" : "/api/site", { method: "POST", headers: { "content-type": "application/json", "x-admin-password": pw }, body: JSON.stringify(a === "regcmds" ? {} : { on, message: offMsg.trim() }) }).catch(() => null);
    if (!r) return toast("Couldn’t reach the server.", "err");
    if (a === "regcmds") return toast((await r.text()).slice(0, 220), r.ok ? "" : "err");
    if (r.ok) { siteOn = on; toast(on ? "Site is back ON." : "Site is now OFF."); admin(); } else toast("Failed: " + r.status + " " + (await r.text()).slice(0, 100), "err");
    return;
  }
  else if (a === "copyw") return copyTxt(weekText(W));
  else if (a === "dbk") { toast("Sending…"); const r = await post({ backup: true }, pw).catch(() => null); return toast(r && r.ok ? "Backup sent to your Discord channel." : "Failed: " + (r ? (await r.text()).slice(0, 100) : "couldn’t reach the server"), r && r.ok ? "" : "err"); }
  else if (a === "vload") { toast("Loading..."); const r = await post({ history: true }, pw).catch(() => null); if (!r || !r.ok) return toast("Couldn’t load versions" + (r ? " (" + r.status + ")" : ""), "err"); vers = await r.json(); }
  else if (a === "vrest") { if (!confirm("Load this older version into your draft? Nothing goes live until you Save & publish.")) return; const r = await post({ version: i }, pw).catch(() => null); if (!r || !r.ok) return toast("Couldn’t load that version.", "err"); const d = await r.json(); snap(true); draft = { SITE: d.SITE, WEEKS: d.WEEKS, ABOUT: d.ABOUT || "" }; markDirty(); toast("Older version loaded into your draft. Review it, then Save & publish."); }
  else if (a === "out") { hist = []; chk = null; if (dirty && !confirm("You have unsaved changes. Log out anyway?")) return; pw = ""; sessionStorage.removeItem("pw"); draft = null; dirty = false; accent(SITE.accent); }
  else if (a === "save") return save();
  else return;
  if (MUT.includes(a)) markDirty();
  admin();
});

async function save() {
  if (saving || !draft || !dirty) return;
  if (loadErr && loadErr !== "empty") return toast("Can’t save: the site couldn’t load your saved content (error " + loadErr + "), and saving now could overwrite it. Fix the connection first.", "err");
  saving = true; toast("Saving...");
  const r = await post(draft, pw).catch(() => null);
  saving = false;
  if (r && r.ok) {
    const d = await r.json(); apply(clone(d)); raw = JSON.stringify(d); draft = clone(d); vers = null; dirty = false; admin(); toast("Saved. It’s live for everyone.");
  } else toast("Save failed: " + (r ? r.status + " " + (await r.text()).slice(0, 120) : "couldn’t reach the server"), "err");
}
addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "s" && draft && location.hash === "#admin") { e.preventDefault(); save(); } });
addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key === "z" && draft && location.hash === "#admin" && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { e.preventDefault(); document.querySelector('[data-a="undo"]').click(); } });
addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

document.addEventListener("change", async e => {   // admin image uploads
  const t = e.target;
  if (t.dataset.imp && draft) {
    try { const d = JSON.parse(await t.files[0].text()); if (!d.SITE || !Array.isArray(d.WEEKS)) throw 0; d.WEEKS.forEach(w => { w.tasks = Array.isArray(w.tasks) ? w.tasks : []; });
      if (!confirm("Replace your current draft with this backup?")) { t.value = ""; return; }
      snap(true); draft = { SITE: d.SITE, WEEKS: d.WEEKS, ABOUT: d.ABOUT || "" }; markDirty(); admin(); toast("Backup loaded into your draft. Review it, then Save & publish.");
    } catch { toast("That doesn’t look like a valid backup file.", "err"); }
    return;
  }
  const kind = t.dataset.up; if (!kind || !draft) return;
  for (const file of t.files) {
    toast("Uploading " + file.name + "...");
    const r = await fetch("/api/upload", { method: "POST", headers: { "content-type": file.type, "x-admin-password": pw }, body: file }).catch(() => null);
    if (!r || !r.ok) return toast("Upload failed: " + (r ? await r.text() : "network error"), "err");
    const { url } = await r.json();
    if (kind === "week") { const w = draft.WEEKS[+t.dataset.i]; (w.images = w.images || []).push(url); } else draft.SITE[kind] = url;
  }
  markDirty(); admin(); toast("Uploaded. Press Save & publish to make it live.");
});

addEventListener("hashchange", () => { warn(); render(); });
$("theme").onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark");
setTheme(root.dataset.theme || "dark");
look(); render(); tick(); setInterval(tick, 1000);
discord(); setInterval(discord, 30000);
loadUptime(); setInterval(loadUptime, 300000);
poll(); setInterval(poll, 8000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
</script>
